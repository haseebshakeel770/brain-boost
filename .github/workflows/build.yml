name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # true = Google test ads, false = your real ads
  USE_TEST_ADS: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q brain-boost-game.zip -d src
      - name: Set ads mode
        run: sed -i "s/val useTestAds = .*/val useTestAds = $USE_TEST_ADS/" src/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          build-root-directory: src
      - name: Build debug APK
        working-directory: src
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BrainBoost-apk
          path: src/app/build/outputs/apk/debug/*.apk
